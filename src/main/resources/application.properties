# \u76D1\u542C\u7AEF\u53E3\u4E3A 8000\uFF08\u9ED8\u8BA4\u4E3A 8080\uFF09
server.port=8000

# \u5E94\u7528\u540D\u79F0
spring.application.name=springboot-starter

# \u542F\u7528\u70ED\u90E8\u7F72\u91CD\u542F (\u751F\u4EA7\u73AF\u5883\u8BF7\u52A1\u5FC5\u8BBE\u4E3A false)
spring.devtools.restart.enabled=true

# \u5F00\u542F\u865A\u62DF\u7EBF\u7A0B (Spring Boot 3.2+ / 4.x \u6838\u5FC3\u7279\u6027)
spring.threads.virtual.enabled=true

# \u542F\u7528 RFC 7807 \u6807\u51C6\u9519\u8BEF\u54CD\u5E94
spring.mvc.problemdetails.enabled=true

# \u4EC5\u66B4\u9732 health \u7AEF\u70B9\uFF0C\u5982\u679C\u9700\u8981\u5168\u90E8\u53EF\u5199 '*'
management.endpoints.web.exposure.include=health
# \u53EF\u9009\uFF1A\u663E\u793A\u8BE6\u7EC6\u7684\u5065\u5EB7\u4FE1\u606F\uFF08\u5982\u6570\u636E\u5E93\u3001Redis\u72B6\u6001\uFF09
management.endpoint.health.show-details=always
# \u7981\u7528\u6570\u636E\u5E93\u5065\u5EB7\u68C0\u67E5\uFF08\u6570\u636E\u5E93\u672A\u542F\u52A8\u65F6 health \u4F1A\u8FD4\u56DE DOWN\uFF0C\u5F71\u54CD\u6574\u4F53\u5065\u5EB7\u72B6\u6001\uFF09
management.health.db.enabled=false

# \u6570\u636E\u5E93\u914D\u7F6E (DataSource)
spring.datasource.url=jdbc:mysql://localhost:3306/springboot_db?characterEncoding=utf-8
spring.datasource.username=root
spring.datasource.password=123456

# JPA / Hibernate \u914D\u7F6E
# DDL \u6A21\u5F0F\uFF1Aupdate \u81EA\u52A8\u66F4\u65B0\u8868\u7ED3\u6784\uFF0C\u751F\u4EA7\u73AF\u5883\u5EFA\u8BAE\u4F7F\u7528 validate \u6216 none
spring.jpa.hibernate.ddl-auto=update
# \u5728\u63A7\u5236\u53F0\u6253\u5370 SQL \u8BED\u53E5\uFF08\u5F00\u53D1\u8C03\u8BD5\u7528\uFF0C\u751F\u4EA7\u73AF\u5883\u5EFA\u8BAE\u5173\u95ED\uFF09
spring.jpa.show-sql=true
# \u683C\u5F0F\u5316\u8F93\u51FA\u7684 SQL\uFF0C\u4FBF\u4E8E\u9605\u8BFB
spring.jpa.properties.hibernate.format_sql=true
# [Hibernate 6+] \u9AD8\u4EAE\u663E\u793A SQL \u5173\u952E\u5B57\uFF0C\u8FDB\u4E00\u6B65\u63D0\u5347\u5F00\u53D1\u8C03\u8BD5\u4F53\u9A8C
spring.jpa.properties.hibernate.highlight_sql=true
# \u6307\u5B9A Hibernate SQL \u65B9\u8A00\uFF08MySQL 8+\uFF09
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# \u5173\u95ED Open Session in View\uFF08\u907F\u514D\u5728\u89C6\u56FE\u6E32\u67D3\u65F6\u4FDD\u6301\u6570\u636E\u5E93\u8FDE\u63A5\uFF0C\u51CF\u5C11\u8FDE\u63A5\u5360\u7528\uFF09
spring.jpa.open-in-view=false
